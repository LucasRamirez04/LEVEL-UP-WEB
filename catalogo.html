<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

<body>

        <nav class="navbar navbar-expand-lg fixed-top barra-navegacion-gamer" data-bs-theme="dark">

                <a class="navbar-brand logo-texto-sitio" href="index.html">MiWebGamer</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link enlace-menu" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link enlace-menu active" aria-current="page" href="catalogo.html">Catálogo</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link enlace-menu" href="Comunidad.html">Comunidad</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link enlace-menu" href="contacto.html">Contacto</a>
                        </li>
                    </ul>

                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <button class="btn nav-link enlace-menu" type="button" data-bs-toggle="offcanvas"
                                data-bs-target="#carritoOffcanvas" aria-controls="carritoOffcanvas">
                                🛒 Carrito
                            </button>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link enlace-menu enlace-login" href="login.html">Iniciar Sesión</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link enlace-menu enlace-login" href="registro.html">Registrarse</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- //MAIN CLASS CONTENEDOR -->
    <main class="contenedor-catalogo">

        <section id="filtros-catalogo">
            <h1 class="titulo-catalogo">Catálogo de Productos</h1>

            <div class="fila-filtros">
                <label for="filtro-categoria" class="form-label texto-secundario">Filtrar por categoría</label>
                <select id="filtro-categoria" class="form-select selector-filtro">
                    <option value="todas" selected>Todas las categorías</option>
                    <option value="Juegos de Mesa">Juegos de Mesa</option>
                    <option value="Accesorios">Accesorios</option>
                    <option value="Consolas/Computadores">Consolas/Computadores</option>
                    <option value="Perifericos">Perifericos</option>
                    <option value="Vestuario">Vestuario</option>
                </select>
            </div>
        </section>

        <section id="grid-productos" class="grid-productos">
            <!-- Las tarjetas de producto se generan dinámicamente desde catalogo.js -->
        </section>

    </main>
    <!-- // FIN MAIN CLASS CONTENEDOR -->


    <!-- //SCRIPTS JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
